<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#42081c"/>
      <stop offset="50%" stop-color="#180510"/>
      <stop offset="100%" stop-color="#080206"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd584"/>
      <stop offset="50%" stop-color="#dfb458"/>
      <stop offset="100%" stop-color="#947124"/>
    </linearGradient>
    <linearGradient id="red2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b53"/>
      <stop offset="60%" stop-color="#e10c22"/>
      <stop offset="100%" stop-color="#700612"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGlow2)"/>

  <!-- Ornate Lace Grid Pattern -->
  <g opacity="0.08" stroke="#ff3b53" stroke-width="1">
    <circle cx="300" cy="380" r="180" fill="none"/>
    <circle cx="300" cy="380" r="240" fill="none"/>
    <path d="M100,200 C300,300 300,500 500,600 M500,200 C300,300 300,500 100,600"/>
  </g>

  <!-- Frame Borders -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="url(#gold2)" stroke-width="1" opacity="0.4"/>
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="#d7192d" stroke-width="1" opacity="0.5"/>

  <!-- Ornate Corner Filigree -->
  <g stroke="url(#gold2)" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M25,55 L55,55 L55,25"/>
    <path d="M575,55 L545,55 L545,25"/>
    <path d="M25,745 L55,745 L55,775"/>
    <path d="M575,745 L545,745 L545,775"/>
  </g>

  <!-- Central Silhouette: Gothic Corset & Crescent Moon -->
  <g transform="translate(300, 360)">
    <!-- Crimson Aura -->
    <circle cx="0" cy="-10" r="145" fill="#e10c22" opacity="0.18" filter="url(#glow2)"/>

    <!-- Crescent Moon Backdrop -->
    <path d="M-40,-130 C40,-130 90,-80 90,-10 C90,60 40,110 -40,110 C-10,85 10,40 10,-10 C10,-60 -10,-105 -40,-130 Z" 
          fill="none" stroke="url(#gold2)" stroke-width="2.5" opacity="0.85"/>

    <!-- Corset Body Shape -->
    <path d="M-55,-60 C-40,-20 -20,-10 -25,50 C-15,55 15,55 25,50 C20,-10 40,-20 55,-60 C35,-50 15,-65 0,-50 C-15,-65 -35,-50 -55,-60 Z" 
          fill="#1c050d" stroke="url(#red2)" stroke-width="2.2"/>

    <!-- Corset Lacing -->
    <g stroke="url(#gold2)" stroke-width="1.6" stroke-linecap="round">
      <line x1="-18" y1="-30" x2="18" y2="-20"/>
      <line x1="18" y1="-20" x2="-16" y2="-10"/>
      <line x1="-16" y1="-10" x2="16" y2="0"/>
      <line x1="16" y1="0" x2="-14" y2="10"/>
      <line x1="-14" y1="10" x2="14" y2="20"/>
      <line x1="14" y1="20" x2="-10" y2="32"/>
      <line x1="-10" y1="32" x2="10" y2="32"/>
    </g>

    <!-- Vampire Rose Motif -->
    <g transform="translate(0, 95)" stroke="url(#gold2)" fill="#940b1b" stroke-width="1.2">
      <circle cx="0" cy="0" r="14"/>
      <path d="M-8,-4 C-4,-12 4,-12 8,-4 C12,4 4,10 0,12 C-4,10 -12,4 -8,-4 Z" fill="#d7192d"/>
      <!-- Thorns -->
      <path d="M-25,10 Q-15,5 -5,8 M5,8 Q15,5 25,10" fill="none" stroke="url(#gold2)"/>
    </g>
  </g>
</svg>
