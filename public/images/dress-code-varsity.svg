<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow1" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3d0c15"/>
      <stop offset="50%" stop-color="#16060c"/>
      <stop offset="100%" stop-color="#080306"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd584"/>
      <stop offset="50%" stop-color="#dfb458"/>
      <stop offset="100%" stop-color="#947124"/>
    </linearGradient>
    <linearGradient id="red1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b53"/>
      <stop offset="60%" stop-color="#d7192d"/>
      <stop offset="100%" stop-color="#700612"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGlow1)"/>

  <!-- Subtle Diamond Mesh Grid Pattern -->
  <g opacity="0.07" stroke="#ffd584" stroke-width="1">
    <path d="M0,100 L600,700 M0,200 L600,800 M0,0 L600,600 M0,300 L500,800"/>
    <path d="M600,100 L0,700 M600,200 L0,800 M600,0 L0,600 M600,300 L100,800"/>
  </g>

  <!-- Ornate Frame Borders -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="url(#gold1)" stroke-width="1" opacity="0.4"/>
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="#d7192d" stroke-width="1" opacity="0.5"/>

  <!-- Ornate Corner Filigree -->
  <g stroke="url(#gold1)" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M25,55 L55,55 L55,25"/>
    <path d="M575,55 L545,55 L545,25"/>
    <path d="M25,745 L55,745 L55,775"/>
    <path d="M575,745 L545,745 L545,775"/>
  </g>

  <!-- Central Crest: Varsity Shield & Aristocrat Skull Mask -->
  <g transform="translate(300, 360)">
    <!-- Blood Aura Halo -->
    <circle cx="0" cy="-20" r="140" fill="#d7192d" opacity="0.16" filter="url(#glow1)"/>
    
    <!-- Shield Outline -->
    <path d="M-90,-120 L90,-120 L90,10 C90,80 0,140 0,140 C0,140 -90,80 -90,10 Z" 
          fill="#120509" stroke="url(#gold1)" stroke-width="2.5"/>
    
    <!-- Shield Inner Inlay -->
    <path d="M-80,-110 L80,-110 L80,5 C80,68 0,125 0,125 C0,125 -80,68 -80,5 Z" 
          fill="none" stroke="#d7192d" stroke-width="1.5" opacity="0.8"/>

    <!-- Varsity Letter 'V' Crest -->
    <path d="M-45,-85 L-18,-85 L0,-25 L18,-85 L45,-85 L14,0 L-14,0 Z" 
          fill="url(#gold1)" filter="url(#glow1)"/>

    <!-- Masquerade Mask Silhouette -->
    <g transform="translate(0, 35)">
      <path d="M-65,-15 C-45,-35 -15,-30 0,-15 C15,-30 45,-35 65,-15 C75,10 45,30 0,32 C-45,30 -75,10 -65,-15 Z" 
            fill="#220710" stroke="url(#red1)" stroke-width="2"/>
      <!-- Eye Cutouts -->
      <path d="M-42,-8 C-30,-18 -18,-5 -22,2 C-26,9 -38,5 -42,-8 Z" fill="#080306" stroke="url(#gold1)" stroke-width="1"/>
      <path d="M42,-8 C30,-18 18,-5 22,2 C26,9 38,5 42,-8 Z" fill="#080306" stroke="url(#gold1)" stroke-width="1"/>
      <!-- Mask Crown Gem -->
      <polygon points="0,-28 6,-18 0,-8 -6,-18" fill="url(#gold1)"/>
    </g>

    <!-- Frat Laurels / Spikes -->
    <g stroke="url(#gold1)" stroke-width="1.2" fill="none" opacity="0.6">
      <path d="M-115,-30 C-125,20 -95,70 -65,100"/>
      <path d="M115,-30 C125,20 95,70 65,100"/>
    </g>
  </g>
</svg>
