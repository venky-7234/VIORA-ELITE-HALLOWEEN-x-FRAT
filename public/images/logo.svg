<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="70 110 1780 830">
  <!-- VIORA ELITE - HALLOWEEN AFTER DARK EDITION (Authentic Vectors with Gothic Royal Gold & Crimson Ember Treatment) -->
  <defs>
    <!-- Filter: Atmospheric Blood Glow -->
    <filter id="halloweenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ff1a35" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="gemGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff3b53" flood-opacity="0.85" />
    </filter>

    <!-- Master Halloween Gradient: Champagne Gold into Imperial Gold into Crimson Flame into Velvet Wine -->
    <linearGradient id="New_Gradient_Swatch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6d9"/>
      <stop offset="24%" stop-color="#ffd175"/>
      <stop offset="52%" stop-color="#dfb458"/>
      <stop offset="74%" stop-color="#e10c22"/>
      <stop offset="92%" stop-color="#9e0716"/>
      <stop offset="100%" stop-color="#4a0108"/>
    </linearGradient>

    <!-- Crest Specific Metallic Gradient (Angled for Wing Feathers) -->
    <linearGradient id="Crest_Wing_Left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="35%" stop-color="#dfb458"/>
      <stop offset="75%" stop-color="#e10c22"/>
      <stop offset="100%" stop-color="#52040c"/>
    </linearGradient>

    <linearGradient id="Crest_Wing_Right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="35%" stop-color="#dfb458"/>
      <stop offset="75%" stop-color="#e10c22"/>
      <stop offset="100%" stop-color="#52040c"/>
    </linearGradient>

    <!-- Central Demonic Ruby Gem Core -->
    <radialGradient id="crestRuby" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff475e"/>
      <stop offset="70%" stop-color="#e10c22"/>
      <stop offset="100%" stop-color="#4a0108"/>
    </radialGradient>

    <!-- Moonlit Crimson Atmospheric Aura behind Crest -->
    <radialGradient id="crestAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a35" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#960313" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Blood Drip Gradient -->
    <linearGradient id="bloodDripGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfb458"/>
      <stop offset="25%" stop-color="#ff263e"/>
      <stop offset="80%" stop-color="#c4071b"/>
      <stop offset="100%" stop-color="#61010b"/>
    </linearGradient>

    <!-- Style Mappings: All 29 original paths mapped to authentic themed gradients -->
    <style>
      .st-gold-crimson { fill: url(#New_Gradient_Swatch); }
      .st-wing-l { fill: url(#Crest_Wing_Left); }
      .st-wing-r { fill: url(#Crest_Wing_Right); }
      .st-gem { fill: url(#crestRuby); filter: url(#gemGlow); }
      .st-drip { fill: url(#bloodDripGrad); }
      .st-bat { fill: #c40a1f; opacity: 0.42; }
    </style>
  </defs>

  <!-- 1. HALLOWEEN ATMOSPHERE (BEHIND LOGO) -->
  <g id="halloween-ambient-backdrop" aria-hidden="true">
    <!-- Soft Crimson Moon Aura behind Royal Crest -->
    <ellipse cx="960" cy="235" rx="280" ry="130" fill="url(#crestAura)" />

    <!-- Left Gothic Bat Silhouette soaring in background -->
    <path class="st-bat" transform="translate(430, 210) scale(0.68) rotate(-14)" d="M30,8 C31.5,4 33,2.5 34,2.5 C34.6,3.5 34.2,5.2 35.5,6 C39.5,4 45.5,4 52.5,1 C51,5.2 48,8.2 44.5,10.2 C49.5,11.2 55.5,10.2 59.5,8 C56.5,12.5 51.5,15.5 45.5,15.5 C43.5,17.2 40.5,18.5 36.5,17.5 C34.5,18.8 32.5,19.8 30,19.8 C27.5,19.8 25.5,18.8 23.5,17.5 C19.5,18.5 16.5,17.2 14.5,15.5 C8.5,15.5 3.5,12.5 0.5,8 C4.5,10.2 10.5,11.2 15.5,10.2 C12,8.2 9,5.2 7.5,1 C14.5,4 20.5,4 24.5,6 C25.8,5.2 25.4,3.5 26,2.5 C27,2.5 28.5,4 30,8 Z" />

    <!-- Right Gothic Bat Silhouette soaring in background -->
    <path class="st-bat" transform="translate(1440, 205) scale(0.68) rotate(14)" d="M30,8 C31.5,4 33,2.5 34,2.5 C34.6,3.5 34.2,5.2 35.5,6 C39.5,4 45.5,4 52.5,1 C51,5.2 48,8.2 44.5,10.2 C49.5,11.2 55.5,10.2 59.5,8 C56.5,12.5 51.5,15.5 45.5,15.5 C43.5,17.2 40.5,18.5 36.5,17.5 C34.5,18.8 32.5,19.8 30,19.8 C27.5,19.8 25.5,18.8 23.5,17.5 C19.5,18.5 16.5,17.2 14.5,15.5 C8.5,15.5 3.5,12.5 0.5,8 C4.5,10.2 10.5,11.2 15.5,10.2 C12,8.2 9,5.2 7.5,1 C14.5,4 20.5,4 24.5,6 C25.8,5.2 25.4,3.5 26,2.5 C27,2.5 28.5,4 30,8 Z" />
  </g>

