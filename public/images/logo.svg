  <!-- 3. TASTEFUL HALLOWEEN DETAILS (EMBEDDED SUBTLY) -->
  <g id="halloween-accents">
    <!-- Glowing Demonic Ruby Gem at Crest Core -->
    <circle class="st-gem" cx="960.8" cy="204" r="6.5" />
    <circle cx="959.8" cy="202.5" r="2" fill="#fff5e0" opacity="0.85" />

    <!-- Delicate Crimson Blood Droplet Trickling Beneath Center Divider -->
    <path class="st-drip" d="M 960.5,901 C 958.5,908, 957.5,917, 960.5,924 C 962,925.5, 963.5,925.5, 964.5,924 C 967.5,917, 965.5,908, 960.5,901 Z" />
