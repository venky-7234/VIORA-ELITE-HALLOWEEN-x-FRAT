    <!-- Horizontal Divider Fluke Lines -->
    <polygon class="st-gold-crimson" points="657.63 902.02 104.53 899.79 657.63 897.56 657.63 902.02 657.63 902.02"/>
    <polygon class="st-gold-crimson" points="1205.46 902.02 1815.47 899.79 1205.46 897.56 1205.46 902.02 1205.46 902.02"/>

